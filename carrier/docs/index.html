<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blinds Controller</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Same palette as the soldering checklist (dark only) */
:root { --bg: #121614; --surface: #1a1f1c; --ink: #e5e9e3; --muted: #98a29c; --line: #2b322e; --accent: #f0b23a;
        --font: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif; color-scheme: dark; }   /* always dark */
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 var(--font); }
main { max-width: 36rem; margin: 0 auto; padding: 48px max(16px, env(safe-area-inset-left, 0px)); }
h1 { font-size: 1.5rem; margin: 0 0 4px; }
p { color: var(--muted); margin: 0 0 24px; }
a.card { display: block; background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--accent);
         border-radius: 8px; padding: 14px 16px; color: inherit; text-decoration: none; }
a.card:hover, a.card:focus-visible { border-color: var(--accent); outline: none; }
a.card strong { display: block; }
a.card span { color: var(--muted); font-size: .92rem; }
</style>
</head>
<body>
<main>
  <h1>Blinds Controller</h1>
  <p>ESP32-S3 stepper controller for window blinds.</p>
  <a class="card" href="soldering-guide/">
    <strong>Soldering guide, carrier rev 2</strong>
    <span>Numbered board picture and a tick-off checklist of all 45 parts in order</span>
  </a>
</main>
</body>
</html>
