<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Carrier v0.2.0 Soldering</title>
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: the page always fits the window. A script measures it and puts the board picture either beside the
   checklist or above it, whichever gives the bigger picture while the list keeps a readable minimum
   (about 240 px wide beside it, or the next part plus two rows below it). Leftover space goes to the list. */
:root {
  --bg: #121614;         /* always dark: near-black with a faint green bias toward the solder mask */
  --surface: #1a1f1c;
  --ink: #e5e9e3;
  --muted: #98a29c;
  --line: #2b322e;
  --next: #f0b23a;       /* the one thing to look at: the next part */
  --next-soft: #3a2f17;
  --done-ink: #5e6762;
  color-scheme: dark;
  --g-red: #d64834; --g-blue: #286ec8; --g-green: #28965a; --g-purple: #8250aa; --g-amber: #d08a1c; --g-teal: #1a9a9a;   /* badge colours on the pictures */
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --imgw: 600px; --imgh: 505px;   /* set by the script */
}

html, body { height: 100%; overflow: hidden; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); box-sizing: border-box; }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font: 15px/1.4 var(--font-body); }
.app { height: 100%; box-sizing: border-box; display: grid; gap: 10px 14px;
       padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px));
       padding-block: 10px; }
.app.side  { grid-template-columns: var(--imgw) minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr);
             grid-template-areas: "pic head" "pic list"; }
.app.stack { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto var(--imgh) minmax(0, 1fr);
             grid-template-areas: "head" "pic" "list"; }

.head { grid-area: head; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.head .top { display: flex; align-items: baseline; justify-content: space-between; gap: 4px 12px; flex-wrap: wrap; }
h1 { font-size: 1rem; margin: 0; text-wrap: balance; }
.progress { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.progress b { color: var(--ink); }
.bar { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
.bar > div { height: 100%; width: 0; background: var(--next); transition: width .25s; }

/* the picture box always has the picture's exact proportions (size set by the script), so nothing stretches */
.pic { grid-area: pic; position: relative; width: var(--imgw); height: var(--imgh); justify-self: center; align-self: start;
       border-radius: 6px; overflow: hidden; }
.pic .face { position: absolute; inset: 0; }
.pic .face img, .pic .face svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.done-layer { opacity: .55; }    /* one translucent layer, so overlapping shapes do not darken twice */
.pic .done-mark { fill: #000; }
.pic .target { fill: none; stroke: var(--next); stroke-width: 7; }
.pic .target.pulse { animation: pulse 1.4s ease-in-out infinite; }
.pic .preview { fill: none; stroke: #ffffff; stroke-width: 5; stroke-dasharray: 14 10; }
@keyframes pulse { 50% { stroke-opacity: .35; } }
@media (prefers-reduced-motion: reduce) { .pic .target.pulse { animation: none; } }

button { font: inherit; color: inherit; cursor: pointer; }
.btn { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; }
.btn:focus-visible, .row:focus-visible, .row input:focus-visible { outline: 2px solid var(--next); outline-offset: 2px; }

/* checklist */
.list { grid-area: list; container: parts / inline-size; position: relative; overflow-y: auto; overscroll-behavior: contain; min-height: 0; min-width: 0;
        padding-right: 2px; display: flex; flex-direction: column; gap: 14px; }
.group h2 { font-size: .74rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 0 0 5px;
            display: flex; align-items: center; gap: 8px; }
.group h2 .chip { width: 11px; height: 11px; border-radius: 50%; background: var(--c); flex: none; }
.group h2 .count { margin-left: auto; font-variant-numeric: tabular-nums; letter-spacing: 0; text-transform: none; }
/* a paragraph between two groups (the power checks) */
.note { border-left: 3px solid var(--next); padding: 2px 0 2px 12px; font-size: .92rem; }
.note h2 { font-size: .74rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 0 0 4px; }
.note p, .note ul { margin: 0 0 6px; }
.note ul { padding-left: 18px; }
.note li { margin-bottom: 2px; }
.rows { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; }
.row { display: grid; grid-template-columns: 22px 2.4ch minmax(0, 1fr) auto; gap: 0 8px; align-items: center;
       padding: 6px 8px; border-top: 1px solid var(--line); cursor: pointer; }
.row:first-child { border-top: 0; border-radius: 8px 8px 0 0; }
.row:last-child { border-radius: 0 0 8px 8px; }
.row input { width: 18px; height: 18px; margin: 0; accent-color: var(--next); cursor: pointer; }
.row .n { font-weight: 700; color: var(--c); text-align: right; font-variant-numeric: tabular-nums; }
.row .name { min-width: 0; }
.row .ref { color: var(--muted); font-size: .85rem; margin-left: 4px; }
.row .orient { display: block; color: var(--muted); font-size: .86rem; line-height: 1.3; margin-top: 1px; }
.row .lcsc { font-family: var(--font-mono); font-size: .8rem; color: var(--muted); white-space: nowrap; text-align: right; }
/* in a thin list, two-part numbers (DevKit sockets) stack instead of widening the column */
@container parts (max-width: 420px) { .row .lcsc .pn { display: block; } .row .lcsc .plus { display: none; } }
.row.done .name, .row.done .lcsc, .row.done .n, .row.done .orient { color: var(--done-ink); }
.row.done .name { text-decoration: line-through; text-decoration-color: var(--line); }
.row:hover:not(.is-next) { background: color-mix(in srgb, var(--next-soft) 45%, transparent); }
/* the next row is the next-part card */
.row.is-next { background: var(--next-soft); box-shadow: inset 4px 0 0 var(--next); padding: 9px 8px; grid-template-columns: 22px 3ch minmax(0, 1fr) auto; }
.row.is-next .n { font-size: 1.35rem; }
.row.is-next .name { font-weight: 700; }
.row.is-next .orient { color: var(--ink); font-size: .92rem; font-weight: 400; }
.row.is-next .lcsc { color: var(--ink); font-size: .88rem; }
.sides { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.sides .btn { padding: 3px 10px; font-size: .88rem; }
.sides .btn[aria-pressed="true"] { border-color: var(--next); color: var(--next); }
/* shown on the picture, under its title, only when the next part is on the other side; flashes with the outline */
.flip-hint { position: absolute; left: 50%; top: 4.6%; transform: translateX(-50%); z-index: 2; white-space: nowrap;
             color: #fff; font-weight: 700; font-size: clamp(.72rem, 1.6vw, .95rem); padding-bottom: 2px;
             border-bottom: 3px solid var(--next); animation: hintpulse 1.4s ease-in-out infinite; }
@keyframes hintpulse { 50% { border-bottom-color: color-mix(in srgb, var(--next) 35%, transparent); } }
@media (prefers-reduced-motion: reduce) { .flip-hint { animation: none; } }
.row .side { font-size: .72rem; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); border: 1px solid var(--line);
             border-radius: 4px; padding: 0 4px; margin-left: 6px; vertical-align: 1px; }
.btn.small { padding: 2px 8px; font-size: .82rem; margin-left: 8px; vertical-align: 1px; }
.btn.armed { border-color: var(--g-red); color: var(--g-red); }
</style>
</head>
<body>

<div class="app side" id="app">
  <div class="head" id="head">
    <div class="top">
      <h1>Carrier v0.2.0 · soldering order</h1>
      <span class="progress"><b id="doneCount">0</b> of <span id="total">45</span> done
        <button class="btn small" id="resetBtn" type="button">Reset progress</button></span>
    </div>
    <div class="bar" aria-hidden="true"><div id="barFill"></div></div>
    <div class="sides"><button class="btn" id="sideF" type="button" aria-pressed="false">Front</button>
      <button class="btn" id="sideB" type="button" aria-pressed="false">Back</button></div>
  </div>
  <div class="pic" id="pic">
    <div class="face" id="faceF"><img src="v0.2.0_front.png" alt="v0.2.0 front with its parts numbered in soldering order">
      <svg viewBox="0 0 1550 1256" aria-hidden="true"><g class="done-layer" id="doneF"></g><rect id="previewF" class="preview" hidden></rect><rect id="targetF" class="target pulse" hidden></rect></svg></div>
    <div class="flip-hint" id="sideHint" hidden>Next part is on the opposite side</div>
    <div class="face" id="faceB" hidden><img src="v0.2.0_back.png" alt="v0.2.0 back, mirrored as seen when soldering it, with its parts numbered in soldering order">
      <svg viewBox="0 0 1550 1256" aria-hidden="true"><g class="done-layer" id="doneB"></g><rect id="previewB" class="preview" hidden></rect><rect id="targetB" class="target pulse" hidden></rect></svg></div>
  </div>
  <section class="list" id="list" aria-label="Parts in soldering order" aria-live="polite"></section>
</div>

<script>
const GROUPS = [{"key": "red", "title": "Back: resistors and capacitors (0805)", "side": "B", "items": [{"n": 1, "ref": "R1", "name": "47k resistor", "lcsc": "C17713", "orient": "", "side": "B", "box": [225.4, 820.7, 35.1, 61.4], "label": "R1"}, {"n": 2, "ref": "R2", "name": "10k resistor", "lcsc": "C17414", "orient": "", "side": "B", "box": [328.9, 221.3, 35.1, 61.4], "label": "R2"}, {"n": 3, "ref": "R11", "name": "10k resistor", "lcsc": "C17414", "orient": "", "side": "B", "box": [1319.3, 463.9, 61.4, 35.1], "label": "R11"}, {"n": 4, "ref": "R13", "name": "10k resistor", "lcsc": "C17414", "orient": "", "side": "B", "box": [1314.8, 676.4, 61.4, 35.1], "label": "R13"}, {"n": 5, "ref": "R16", "name": "10k resistor", "lcsc": "C17414", "orient": "", "side": "B", "box": [347.3, 675.4, 61.4, 35.1], "label": "R16"}, {"n": 6, "ref": "R3", "name": "1k resistor", "lcsc": "C17513", "orient": "", "side": "B", "box": [328.9, 333.8, 35.1, 61.4], "label": "R3"}, {"n": 7, "ref": "R14", "name": "1k resistor", "lcsc": "C17513", "orient": "", "side": "B", "box": [284.8, 1015.1, 35.1, 61.4], "label": "R14"}, {"n": 8, "ref": "R4", "name": "100 Ω resistor", "lcsc": "C17408", "orient": "", "side": "B", "box": [1280.6, 855.4, 61.4, 35.1], "label": "R4"}, {"n": 9, "ref": "R15", "name": "3.3k resistor", "lcsc": "C26010", "orient": "", "side": "B", "box": [284.8, 1093.4, 35.1, 61.4], "label": "R15"}, {"n": 10, "ref": "R17", "name": "4.7k resistor", "lcsc": "C17673", "orient": "", "side": "B", "box": [596.6, 306.4, 61.4, 35.1], "label": "R17"}, {"n": 11, "ref": "R18", "name": "4.7k resistor", "lcsc": "C17673", "orient": "", "side": "B", "box": [596.6, 396.4, 61.4, 35.1], "label": "R18"}, {"n": 12, "ref": "C5", "name": "100 nF capacitor", "lcsc": "C49678", "orient": "", "side": "B", "box": [251.0, 189.5, 36.2, 62.1], "label": "C5"}, {"n": 13, "ref": "C6", "name": "100 nF capacitor", "lcsc": "C49678", "orient": "", "side": "B", "box": [251.0, 373.9, 36.2, 62.1], "label": "C6"}, {"n": 14, "ref": "C7", "name": "100 nF capacitor", "lcsc": "C49678", "orient": "", "side": "B", "box": [596.2, 215.9, 62.1, 36.2], "label": "C7"}, {"n": 15, "ref": "C13", "name": "100 nF capacitor", "lcsc": "C49678", "orient": "", "side": "B", "box": [1318.9, 565.1, 62.1, 36.2], "label": "C13"}, {"n": 16, "ref": "C8", "name": "4.7 µF capacitor", "lcsc": "C1779", "orient": "", "side": "B", "box": [1208.2, 935.9, 62.1, 36.2], "label": "C8"}]}, {"key": "blue", "title": "Back: chips, diodes and transistors", "side": "B", "items": [{"n": 17, "ref": "Q2", "name": "2N7002 transistor (SOT-23)", "lcsc": "C8545", "orient": "Single leg on the right", "side": "B", "box": [342.8, 580.9, 70.4, 62.1], "label": "Q2"}, {"n": 18, "ref": "D2", "name": "15 V zener (SOD-123)", "lcsc": "C2126", "orient": "Band (−) down", "side": "B", "box": [235.3, 690.8, 42.3, 85.5], "label": "D2"}, {"n": 19, "ref": "U2", "name": "XL1509 buck regulator (SOIC-8)", "lcsc": "C74192", "orient": "Pin 1 dot top-left", "side": "B", "box": [357.7, 931.9, 134.1, 98.1], "label": "U2"}, {"n": 20, "ref": "U5", "name": "DS3231 clock (SOIC-16)", "lcsc": "C9866", "orient": "Pin 1 dot top-left", "side": "B", "box": [710.0, 234.1, 214.4, 195.3], "label": "U5"}, {"n": 21, "ref": "C14", "name": "10 µF 50 V capacitor (1210)", "lcsc": "C138687", "orient": "", "side": "B", "box": [273.1, 912.1, 58.5, 83.7], "label": "C14"}, {"n": 22, "ref": "D4", "name": "SS14 diode (5 V path)", "lcsc": "C2480", "orient": "Band (−) to the left", "side": "B", "box": [640.3, 994.1, 126.9, 63.9], "label": "D4"}, {"n": 23, "ref": "D5", "name": "SS16 diode (buck)", "lcsc": "C2481", "orient": "Band (−) to the left", "side": "B", "box": [352.3, 1066.0, 126.9, 63.9], "label": "D5"}, {"n": 24, "ref": "D6", "name": "SS14 diode (relay coil)", "lcsc": "C2480", "orient": "Band (−) down", "side": "B", "box": [346.0, 736.6, 63.9, 126.9], "label": "D6"}, {"n": 25, "ref": "D1", "name": "24 V TVS (SMB)", "lcsc": "C83268", "orient": "Either way round (bidirectional)", "side": "B", "box": [80.5, 239.8, 81.9, 132.3], "label": "D1"}, {"n": 26, "ref": "Q1", "name": "P-channel MOSFET (DPAK)", "lcsc": "C513222", "orient": "Big tab up, two legs down", "side": "B", "box": [87.8, 516.1, 126.9, 200.7], "label": "Q1"}]}, {"key": "green", "title": "Front: fuse, inductor, electrolytic capacitors", "side": "F", "items": [{"n": 27, "ref": "F1", "name": "3 A fuse", "lcsc": "C178991", "orient": "", "side": "F", "box": [1206.0, 910.8, 66.8, 133.7], "label": "F1"}, {"n": 28, "ref": "L1", "name": "68 µH inductor", "lcsc": "C168091", "orient": "", "side": "F", "box": [1076.4, 918.0, 121.5, 117.9], "label": "L1"}, {"n": 29, "ref": "C16", "name": "220 µF 10 V capacitor", "lcsc": "C7469982", "orient": "+ pad on the left, black stripe (−) right", "side": "F", "box": [1076.4, 1053.0, 173.7, 128.7], "label": "C16"}, {"n": 30, "ref": "C4", "name": "100 µF 50 V capacitor", "lcsc": "C178548", "orient": "+ pad on the left, black stripe (−) right", "side": "F", "box": [1294.2, 522.0, 189.9, 159.3], "label": "C4"}]}, {"key": "purple", "title": "Front: through-hole parts", "side": "F", "items": [{"n": 31, "ref": "U6", "name": "IR receiver", "lcsc": "C141632", "orient": "Stand it with the lens toward the top of the board, then down into the square. OUT leg on the right", "side": "F", "box": [99.0, 954.0, 146.7, 191.7], "label": "U6"}, {"n": 32, "ref": "J2", "name": "Motor connector (right angle)", "lcsc": "C157925", "orient": "Opening toward the left edge", "side": "F", "box": [63.0, 144.0, 226.1, 242.1], "label": "J2"}, {"n": 33, "ref": "BT1", "name": "CR2032 holder", "lcsc": "C5239862", "orient": "+ clip at the bottom", "side": "F", "box": [109.8, 392.4, 407.2, 450.9], "label": "BT1"}, {"n": 34, "ref": "S1", "name": "Toggle switch", "lcsc": "C55072606", "orient": "Either way round; the lever flips up and down", "side": "F", "box": [351.0, 873.0, 130.5, 240.3], "label": "S1"}, {"n": 35, "ref": "K1", "name": "Relay", "lcsc": "C18198081", "orient": "Pin 1 / coil end (marked) at the top", "side": "F", "box": [1076.4, 522.0, 191.3, 375.3], "label": "K1"}, {"n": 36, "ref": "J1", "name": "Power jack", "lcsc": "C381115", "orient": "", "side": "F", "box": [1281.6, 941.4, 206.1, 288.9], "label": "J1"}]}, {"note": "", "blocks": [["p", "Check the power supply before the modules go on, while a wrong voltage can't damage them yet. Plug the 24 V supply's cord into J1. Set the multimeter to DC volts, keep the black probe on ground (C4's striped − pad) and touch the red probe to each point:"]], "items": []}, {"key": "check", "title": "Power check (24 V in)", "side": "F", "items": [{"n": 37, "ref": "C4", "name": "C4's + pad", "lcsc": "≈ 24 V", "orient": "", "side": "F", "box": [1294.2, 522.0, 189.9, 159.3], "label": "check"}, {"n": 38, "ref": "C16", "name": "C16's + pad", "lcsc": "5.1–5.5 V", "orient": "", "side": "F", "box": [1076.4, 1053.0, 173.7, 128.7], "label": "check"}, {"n": 39, "ref": "D4", "name": "D4's band end (back)", "lcsc": "4.8–5.5 V", "orient": "", "side": "B", "box": [640.3, 994.1, 126.9, 63.9], "label": "check"}]}, {"note": "", "blocks": [["p", "Unplug the cord before you solder the modules. If a reading was off:"], ["ul", ["C4 at 0 V: no power gets past Q1. Check F1, Q1, R1 and D2.", "C16 off: the 5 V regulator. Check U2, R14 (1k), R15 (3.3k), L1 and D5.", "D4 well below C16: check D4's direction (band to the left on the back)."]]], "items": []}, {"key": "amber", "title": "Front: modules", "side": "F", "items": [{"n": 40, "ref": "U4", "name": "TMC2209 StepStick, then its 9 × 9 × 5 mm heatsink", "lcsc": "on hand", "orient": "EN pin top-left (INDEX/DIAG pins along the top). Solder on its own pins; keep the heatsink inside the pin rows", "side": "F", "box": [1094.1, 125.7, 294.7, 386.1], "label": "U4"}, {"n": 41, "ref": "U3", "name": "ESP32-S3 DevKit", "lcsc": "on hand", "orient": "Antenna at the top, hanging past the edge; USB at the bottom. Solder on its own pins", "side": "F", "box": [527.7, 130.8, 523.3, 1026.2], "label": "U3"}]}, {"note": "", "blocks": [["p", "Plug the cord into J1 again. Black probe on ground, red probe on:"]], "items": []}, {"key": "check3v3", "title": "3.3 V check (24 V in)", "side": "F", "items": [{"n": 42, "ref": "U3", "name": "DevKit's 3V3 pin (top left)", "lcsc": "3.2–3.4 V", "orient": "", "side": "F", "box": [527.7, 130.8, 523.3, 1026.2], "label": "check"}]}, {"note": "", "blocks": [["p", "Unplug the cord before you go on. If the reading is low, or the DevKit gets warm, unplug at once: look for a short on the 3.3 V parts (U5, U6, C6, C7) or a solder bridge on the DevKit's pins."]], "items": []}, {"key": "teal", "title": "Back: Hall sensors", "side": "B", "items": [{"n": 43, "ref": "U7", "name": "Hall sensor A (top)", "lcsc": "C111925", "orient": "Insert into enclosure, then put board on top to get the right pin length. Chamfered side facing left.", "side": "B", "box": [1448.5, 463.1, 42.7, 82.1], "label": "U7"}, {"n": 44, "ref": "U8", "name": "Hall sensor B (bottom)", "lcsc": "C111925", "orient": "Same as U7", "side": "B", "box": [1448.5, 602.7, 42.7, 82.1], "label": "U8"}]}, {"note": "", "blocks": [["p", "Last, check that the motor relay keeps the motor disconnected when the board is off. Plug the motor into J2, with the 24 V cord and USB unplugged."]], "items": []}, {"key": "checkrelay", "title": "Relay check (nothing plugged in)", "side": "F", "items": [{"n": 45, "ref": "J2", "name": "Spin the motor shaft quickly by hand", "lcsc": "DevKit LEDs stay off", "orient": "", "side": "F", "box": [63.0, 144.0, 226.1, 242.1], "label": "check"}]}, {"note": "", "blocks": [["p", "If a DevKit LED lights, the spinning motor is powering the board through the driver, so K1 isn't opening: check that K1 is the right way round (pin 1 at the top) and for solder bridges between its pins."]], "items": []}, {"note": "Coin cell", "blocks": [["p", "Put a CR2032 in BT1, + side up, before running the firmware's bring-up test. The cell keeps the clock running while the board is off: the test sets the clock on its first run, and on the next run (after a minute or more with the board unplugged) checks that it kept time."]], "items": []}];
const COLORS = { check: "var(--muted)", check3v3: "var(--muted)", checkrelay: "var(--muted)", red: "var(--g-red)", blue: "var(--g-blue)", green: "var(--g-green)", purple: "var(--g-purple)", amber: "var(--g-amber)", teal: "var(--g-teal)" };
const KEY = "carrier-v0.2.0-solder-v1";
const ASPECT = 1550 / 1256;
const LIST_MIN_W = 240, LIST_MIN_H = 150;   // a readable list beside the picture / the next part plus two rows below it
const items = GROUPS.flatMap(g => g.items.map(it => ({ ...it, group: g.key })));
let done = new Set();
try { done = new Set(JSON.parse(localStorage.getItem(KEY) || "[]")); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify([...done])); } catch (e) {} };

const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
$("total").textContent = items.length;

$("list").innerHTML = GROUPS.map(g => g.blocks ? `
  <div class="note">${g.note ? `<h2>${esc(g.note)}</h2>` : ""}${g.blocks.map(([kind, body]) => kind === "p" ? `<p>${esc(body)}</p>` :
    `<ul>${body.map(b => `<li>${esc(b)}</li>`).join("")}</ul>`).join("")}</div>` : `
  <div class="group" data-side="${g.side}" style="--c:${COLORS[g.key]}">
    <h2><span class="chip"></span>${esc(g.title)}<span class="count" data-count="${g.key}"></span></h2>
    <div class="rows">${g.items.map(it => `
      <div class="row" id="row${it.n}" data-n="${it.n}" tabindex="-1">
        <input type="checkbox" id="chk${it.n}" aria-label="Done: ${it.n} ${esc(it.name)}">
        <span class="n">${it.n}</span>
        <span class="name">${esc(it.name)}${it.label ? `<span class="ref">${it.label}</span>` : ""}${it.orient ? `<span class="orient">${esc(it.orient)}</span>` : ""}</span>
        <span class="lcsc">${it.lcsc.split(" + ").map(c => `<span class="pn">${esc(c)}</span>`).join('<span class="plus"> + </span>')}</span>
      </div>`).join("")}
    </div>
  </div>`).join("");

// Pick the layout that gives the bigger picture, then size the picture box to its exact proportions.
function layout() {
  const app = $("app"), cs = getComputedStyle(app);
  const W = app.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const H = app.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
  const gapX = parseFloat(cs.columnGap) || 14, gapY = parseFloat(cs.rowGap) || 10, headH = $("head").offsetHeight;
  const sideW = Math.max(0, Math.min(W - LIST_MIN_W - gapX, H * ASPECT));
  const stackW = Math.max(0, Math.min(W, (H - headH - LIST_MIN_H - 2 * gapY) * ASPECT));
  const side = sideW >= stackW, w = Math.floor(side ? sideW : stackW);
  app.classList.toggle("side", side); app.classList.toggle("stack", !side);
  app.style.setProperty("--imgw", w + "px"); app.style.setProperty("--imgh", Math.floor(w / ASPECT) + "px");
}

const setBox = (el, it) => { const [x, y, w, h] = it.box, p = 10;
  el.setAttribute("x", x - p); el.setAttribute("y", y - p); el.setAttribute("width", w + 2 * p); el.setAttribute("height", h + 2 * p); };

// Which face is shown: the side of the next part, unless the reader picked one with the buttons
// SVG shapes have no .hidden property, so outlines are shown and hidden through the attribute
const vis = (el, on) => on ? el.removeAttribute("hidden") : el.setAttribute("hidden", "");
let shown = "F", manual = null;
const nextItem = () => items.find(it => !done.has(it.n));
function updateHint() {
  const next = nextItem();
  vis($("sideHint"), !!next && next.side !== shown);
}
// The picture follows the list: the side of the group at the top of the list's view
function sideFromScroll() {
  const l = $("list"), top = l.getBoundingClientRect().top + 24;
  for (const g of l.querySelectorAll(".group")) if (g.getBoundingClientRect().bottom > top) return g.dataset.side;
  return "F";
}
function showSide(side) {
  shown = side;
  $("faceF").hidden = side !== "F"; $("faceB").hidden = side !== "B";
  $("sideF").setAttribute("aria-pressed", side === "F"); $("sideB").setAttribute("aria-pressed", side === "B");
  updateHint();
}
function render(scroll) {
  const next = items.find(it => !done.has(it.n));
  items.forEach(it => {
    const row = $("row" + it.n);
    row.classList.toggle("done", done.has(it.n));
    row.classList.toggle("is-next", next === it);
    $("chk" + it.n).checked = done.has(it.n);
  });
  GROUPS.filter(g => !g.blocks).forEach(g => { const d = g.items.filter(it => done.has(it.n)).length;
    document.querySelector(`[data-count="${g.key}"]`).textContent = `${d} / ${g.items.length}`; });
  $("doneCount").textContent = done.size;
  $("barFill").style.width = (100 * done.size / items.length) + "%";
  for (const sd of ["F", "B"]) {
    $("done" + sd).innerHTML = items.filter(it => it.side === sd && done.has(it.n)).map(it => { const [x, y, w, h] = it.box;
      // the cover spans the part's outline plus its number badge, which is bigger than a small 0805 part
      const p = 8;    // a margin past the part's outline, so the cover reads as a rounded box around it
      return `<rect class="done-mark" x="${x - p}" y="${y - p}" width="${w + 2 * p}" height="${h + 2 * p}" rx="10"></rect>` +
             `<circle class="done-mark" cx="${x + w / 2}" cy="${y + h / 2}" r="25"></circle>`; }).join("");
    const t = $("target" + sd);
    if (next && next.side === sd) { setBox(t, next); vis(t, true); } else { vis(t, false); }
  }
  if (scroll) manual = null;
  if (!manual) showSide(sideFromScroll()); else updateHint();
  if (scroll && next) {
    // Scroll only the list: the next part near the top, with one finished row above it
    const list = $("list"), r = $("row" + next.n).getBoundingClientRect(), l = list.getBoundingClientRect();
    const top = list.scrollTop + r.top - l.top - 44;
    list.scrollTo({ top: Math.max(0, top), behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
  }
}
$("list").addEventListener("scroll", () => { if (!manual) showSide(sideFromScroll()); }, { passive: true });
$("list").addEventListener("wheel", () => { manual = null; }, { passive: true });
$("list").addEventListener("touchstart", () => { manual = null; }, { passive: true });
$("sideF").onclick = () => { manual = "F"; showSide("F"); };
$("sideB").onclick = () => { manual = "B"; showSide("B"); };

$("list").addEventListener("click", e => {
  const row = e.target.closest(".row"); if (!row) return;
  const n = +row.dataset.n, wasNext = row.classList.contains("is-next");
  done.has(n) ? done.delete(n) : done.add(n);
  save(); render(wasNext && done.has(n));   // scroll only when the highlighted part is ticked
});
$("list").addEventListener("mouseover", e => {
  const row = e.target.closest(".row"); vis($("previewF"), false); vis($("previewB"), false);
  if (!row || row.classList.contains("is-next")) { showSide(manual || sideFromScroll()); return; }
  const it = items.find(i => i.n === +row.dataset.n), pv = $("preview" + it.side);
  showSide(it.side); setBox(pv, it); vis(pv, true);
});
$("list").addEventListener("mouseleave", () => { vis($("previewF"), false); vis($("previewB"), false);
  showSide(manual || sideFromScroll()); });

// Reset progress: a second click within 3 s confirms
let armed = 0;
const resetLabel = b => { b.textContent = "Reset progress"; b.classList.remove("armed"); };
$("resetBtn").onclick = () => {
  const b = $("resetBtn");
  if (Date.now() - armed < 3000) { done.clear(); save(); render(true); resetLabel(b); armed = 0; return; }
  armed = Date.now(); b.textContent = "Click again to reset"; b.classList.add("armed");
  setTimeout(() => { if (Date.now() - armed >= 3000) resetLabel(b); }, 3100);
};

layout();
addEventListener("resize", () => { layout(); });
if (document.fonts) document.fonts.ready.then(layout);
render(true);
</script>
</body>
</html>
