# Release signing for the Blinds app. Copy to keystore.properties (same folder, git-ignored) and fill in.
# Create the key once (it asks for a password; keep the .jks file outside the repository and back it up:
# without it you can't install an update over the app, only uninstall and reinstall, losing its settings):
#
#   /opt/android-studio/jbr/bin/keytool -genkeypair -v -keystore ~/keys/blinds-release.jks \
#       -alias blinds -keyalg RSA -keysize 4096 -validity 10000 -dname "CN=Blinds"
#
# Then: ./gradlew assembleRelease  ->  app/build/outputs/apk/release/app-release.apk

storeFile=/home/YOU/keys/blinds-release.jks
storePassword=the password you typed
keyAlias=blinds
# keyPassword is only needed if it differs from storePassword (keytool's PKCS12 default uses the same one).
# A single "password=..." for both also works, so a Tauri project's keystore.properties can be copied as is.
