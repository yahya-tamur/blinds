# Publishes docs/ to GitHub Pages: the landing page at /, the v0.2.0 soldering checklist and locate.html.
name: Pages

on:
  push:
    branches: [main]
    paths: ["docs/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3   # docs/ is laid out exactly like the site
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
