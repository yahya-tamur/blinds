# Publishes carrier/docs to GitHub Pages: the landing page at / and the soldering checklist at /soldering-guide/.
name: Pages

on:
  push:
    branches: [main]
    paths: ["carrier/docs/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3   # carrier/docs is laid out exactly like the site
        with:
          path: carrier/docs
      - id: deployment
        uses: actions/deploy-pages@v4
