# The Wi-Fi network the controller joins. Copy this file to wifi.properties (next to it, at the
# top of the repository) and fill in your network. wifi.properties is git-ignored so the password
# isn't committed.
#
# Read by the firmware build (firmware/main/CMakeLists.txt); without the file the controller's Wi-Fi
# stays off. Rebuild and flash after changing it. (The Android app doesn't use this file: its network
# name is set in the app's Settings, and it never has the password.)
#
# Format: key = value, one per line. Everything after the "=" is the value as typed: no quotes,
# no escapes; spaces at both ends are dropped. Lines starting with # are comments.

ssid = your-network-name
password = your-password
